# OpenShift SCC compatibility overlay for the shared supervisor.
# The gateway auto-detects OpenShift and allows restricted-v2 SCC assignment
# of its UID and fsGroup without overrides. Layer after values.yaml:
#   helm install openshell deploy/helm/openshell -f ci/values-openshift-scc.yaml
#
# The e2e Kubernetes harness applies this automatically when it detects an
# OpenShift cluster (route.openshift.io API present).

# The shared supervisor keeps runAsNonRoot and its seccomp profile; the SCC
# assigns its user, group, and fsGroup IDs.
supervisor:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
